services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamqueue
      POSTGRES_USER: streamqueue
      POSTGRES_PASSWORD: streamqueue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamqueue"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://streamqueue:streamqueue@db:5432/streamqueue
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: npm run dev

volumes:
  pgdata:
